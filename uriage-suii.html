<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>売上推移 管理アプリ</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15181d; --muted:#697386; --line:#dfe3e8;
  --line2:#eef1f4; --accent:#1a6ee0; --accent-w:#e8f0fd;
  --pos:#0a7c42; --neg:#c2333c; --head:#f0f2f5; --zebra:#fafbfc; --sel:#e8f0fd;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14161a; --panel:#1b1e24; --ink:#e6e9ee; --muted:#9aa3b2; --line:#2c313a;
    --line2:#23272e; --accent:#5b9bf5; --accent-w:#1c2c45; --pos:#3fbf7f; --neg:#f0707a;
    --head:#22262d; --zebra:#1e2128; --sel:#1c2c45; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:13px}
.wrap{max-width:1500px;margin:0 auto;padding:14px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em}
.sub{color:var(--muted);font-size:11.5px}
.spacer{flex:1}
.kbnbox{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
nav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;
  font:inherit;font-size:13px;color:var(--muted);cursor:pointer;border-radius:5px 5px 0 0}
nav button:hover{background:var(--line2);color:var(--ink)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select,input[type=text]{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--ink)}
input[type=text]{min-width:190px}
label.f{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
.btn{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:9px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.card .k{color:var(--muted);font-size:11px;margin-bottom:5px}
.card .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card .d{font-size:11.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;
  background:var(--accent-w);color:var(--accent);vertical-align:1px}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;text-align:right}
th{position:sticky;top:0;z-index:3;background:var(--head);font-weight:600;font-size:11.5px;
  color:var(--muted);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th.nos{cursor:default}
th:hover:not(.nos){color:var(--accent)}
th.l,td.l{text-align:left}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--sel)}
tbody tr.clk{cursor:pointer}
tfoot td{position:sticky;bottom:0;background:var(--head);font-weight:650;border-top:1px solid var(--line);z-index:2}
.sun{color:var(--neg)} .sat{color:var(--accent)}
.arrow{font-size:9px;opacity:.75}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:12px}
.chart h3{margin:0 0 9px;font-size:12.5px;font-weight:650;color:var(--muted)}
svg{display:block;width:100%;height:auto}
.lg{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.note{color:var(--muted);font-size:11.5px;line-height:1.75;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-top:12px}
.note b{color:var(--ink)}
.hint{color:var(--muted);font-size:11.5px;margin:-4px 0 9px}
.warn{background:var(--accent-w);border:1px solid var(--accent);color:var(--ink);
  border-radius:7px;padding:7px 11px;font-size:11.5px;margin-bottom:9px}
.cnt{color:var(--muted);font-size:11.5px}
@media (max-width:640px){ .wrap{padding:9px} th,td{padding:4px 6px;font-size:12px} }
/* ---- ロック画面（publish-intranet.ps1 が本体テンプレートに差し込む） ---- */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:26px 28px;max-width:400px;width:100%}
#lock h2{margin:0 0 4px;font-size:16px;font-weight:650}
#lock .lead{color:var(--muted);font-size:12px;margin:0 0 18px;line-height:1.7}
#lock label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
#lock input{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--ink)}
#lock input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
#lock .row{display:flex;gap:9px;align-items:center;margin-top:14px}
#lock button{font:inherit;font-size:13px;font-weight:600;padding:8px 18px;border:0;border-radius:6px;
  background:var(--accent);color:#fff;cursor:pointer}
#lock button:disabled{opacity:.55;cursor:default}
#lock .msg{font-size:12px;min-height:1.4em;margin-top:11px}
#lock .keep{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:13px}
#lock .keep input{width:auto}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <h2>売上推移 管理アプリ</h2>
    <p class="lead">社内用のデータです。閲覧にはパスワードが必要です。<br>
      パスワードは総務までお問い合わせください。</p>
    <form id="lockForm" autocomplete="off">
      <label for="pw">パスワード</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus>
      <label class="keep"><input type="checkbox" id="keep" checked>このブラウザでは次回から入力を省略する</label>
      <div class="row"><button type="submit" id="go">開く</button></div>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<div class="wrap" id="app" hidden>
<header>
  <h1>売上推移 管理アプリ</h1>
  <span class="sub" id="cover"></span>
  <span class="spacer"></span>
  <span class="kbnbox">取引区分
    <select id="kbn" title="工場への払い出し・振替・廃棄などを含めるか">
      <option value="ext">社外取引のみ</option>
      <option value="int">社内取引のみ</option>
      <option value="all">すべて</option>
    </select>
  </span>
</header>

<nav>
  <button data-t="dash" class="on">ダッシュボード</button>
  <button data-t="day">日別</button>
  <button data-t="mon">月別</button>
  <button data-t="prod">商品別</button>
  <button data-t="pcal">商品×日別</button>
  <button data-t="cust">取引先別</button>
  <button data-t="cross">クロス集計</button>
  <button data-t="src">データ元</button>
</nav>

<div id="view"></div>

<div class="note" id="note"></div>
</div>

<script>
"use strict";
function bootApp(D){
const MONTHS = D.months, DATES = D.dates, PROD = D.products,
      CUST = D.customers, SUPP = D.suppliers, F = D.f, FP = D.fp, DM = D.dm;

const dIdx = new Map(DATES.map((d,i)=>[d,i]));
const mIdx = new Map(MONTHS.map((m,i)=>[m,i]));
const dMon = DATES.map(d=>mIdx.get(d.slice(0,7)));   // 日付index -> 月index

// ---------- 表示ヘルパ ----------
const WD = ['日','月','火','水','木','金','土'];
const yen  = n => (n<0?'-':'') + '¥' + Math.round(Math.abs(n)).toLocaleString('ja-JP');
const num  = n => Math.round(n).toLocaleString('ja-JP');
const pct  = n => (n>=0?'+':'') + n.toFixed(1) + '%';
const rate = (a,b) => b ? (a/b*100) : 0;
const wd   = ds => new Date(ds+'T00:00:00').getDay();
const mLabel = m => { const [y,mm]=m.split('-'); return y.slice(2)+'年'+(+mm)+'月'; };
const dLabel = ds => { const p=ds.split('-'); return (+p[1])+'/'+(+p[2]); };
const prevM = m => { const [y,mm]=m.split('-').map(Number); return (y-1)+'-'+String(mm).padStart(2,'0'); };
const prevD = ds => { const [y,m,d]=ds.split('-').map(Number); return (y-1)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function delta(cur, prev){
  if(prev===null||prev===undefined) return '<span class="mut">—</span>';
  if(prev===0) return cur? '<span class="pos">新規</span>' : '<span class="mut">—</span>';
  const r = (cur-prev)/Math.abs(prev)*100;
  return '<span class="'+(r>0?'pos':r<0?'neg':'mut')+'">'+pct(r)+'</span>';
}

/* ============================================================
   取引区分フィルタ。売上ファイルには工場への払い出し・振替・廃棄が
   含まれ、単価0で計上されるため既定では除外する。
   ============================================================ */
let KBN = localStorage.getItem('uriage-kbn') || 'ext';   // ext | int | all
const KBN_LABEL = { ext:'社外取引のみ', int:'社内取引のみ', all:'すべて' };
const passC = ci => KBN==='all' || ((CUST[ci][3]===1) === (KBN==='int'));
const passS = si => KBN==='all' || ((SUPP[si][3]===1) === (KBN==='int'));

// ---------- 明細から集計しなおす（KBN 変更のたびに実行） ----------
let DAILY, monTot, pmByMonth, pdByProd, cmByMonth, fRows, fpRows;

function rebuild(){
  fRows  = F.filter(r=>passC(r[1]));
  fpRows = FP.filter(r=>passS(r[1]));

  DAILY = DATES.map((_,i)=>({ amt:0, ara:0, qty:0, hon:0, slip:0, pamt:0, pqty:0 }));
  DATES.forEach((_,i)=>{
    DAILY[i].slip = KBN==='ext' ? DM[i][0] : KBN==='int' ? DM[i][1] : DM[i][0]+DM[i][1];

// ---------- 並べ替え可能なテーブル ----------
function makeTable(host, cols, rows, opt){
  opt = opt || {};
  let sortKey = opt.sortKey!==undefined ? opt.sortKey : null;
  let sortDir = opt.sortDir || -1;
  const tw = document.createElement('div'); tw.className='tw';
  host.appendChild(tw);
  function render(){
    let rs = rows.slice();
    if(sortKey!==null && cols[sortKey]){
      const c = cols[sortKey];
      rs.sort((a,b)=>{
        const x=c.v(a), y=c.v(b);
        if(typeof x==='string'||typeof y==='string') return String(x).localeCompare(String(y),'ja')*sortDir;
        return ((x||0)-(y||0))*sortDir;
      });
    }
    let h = '<table><thead><tr>';
    cols.forEach((c,i)=>{
      const ar = sortKey===i ? '<span class="arrow">'+(sortDir<0?' ▼':' ▲')+'</span>' : '';
      h += '<th class="'+(c.l?'l':'')+(c.nos?' nos':'')+'" data-i="'+i+'" title="'+esc(c.t||c.h)+'">'+c.h+ar+'</th>';
    });
    h += '</tr></thead><tbody>';
    rs.forEach(r=>{
      h += '<tr'+(opt.onRow?' class="clk" data-k="'+esc(opt.key(r))+'"':'')+'>';
      cols.forEach(c=>{ h += '<td class="'+(c.l?'l':'')+'">'+c.f(r)+'</td>'; });
      h += '</tr>';
    });
    h += '</tbody>';
    if(opt.foot) h += '<tfoot><tr>'+cols.map(c=>'<td class="'+(c.l?'l':'')+'">'+opt.foot(c,rs)+'</td>').join('')+'</tr></tfoot>';
    h += '</table>';
    tw.innerHTML = h;
    tw.querySelectorAll('th:not(.nos)').forEach(th=>th.onclick=()=>{
      const i=+th.dataset.i;
      if(sortKey===i) sortDir=-sortDir; else { sortKey=i; sortDir = cols[i].l?1:-1; }
      render();
    });
    if(opt.onRow) tw.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>opt.onRow(tr.dataset.k));
  }
  render();
  return { csv: ()=>{
    const strip = s => String(s).replace(/<[^>]*>/g,'');
    const lines=[cols.map(c=>'"'+strip(c.h).replace(/"/g,'""')+'"').join(',')];
    rows.forEach(r=>lines.push(cols.map(c=>{
      const raw = c.v(r);
      return typeof raw==='string' ? '"'+raw.replace(/"/g,'""')+'"' : raw;
    }).join(',')));
    return lines.join('\r\n');
  }};
}

function dlCsv(name, text){
  const blob = new Blob(['﻿'+text], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}

// ---------- 棒グラフ ----------
function barChart(host, title, labels, series, fmt){
  const W=1000, H=250, PL=64, PR=10, PT=12, PB=30;
  const iw=W-PL-PR, ih=H-PT-PB;
  const all = series.flatMap(s=>s.data).filter(v=>v!==null && v!==undefined);
  const max = Math.max(1, ...all);
  const n = labels.length, gw = iw/n, bw = Math.max(2,(gw-5)/series.length);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:250px">';
  for(let i=0;i<=4;i++){
    const y = PT+ih-ih*i/4;
    s += '<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--line2)" stroke-width="1"/>';
    s += '<text x="'+(PL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmt(max*i/4)+'</text>';
  }
  labels.forEach((lb,i)=>{
    series.forEach((se,j)=>{
      const v = se.data[i]; if(v===null||v===undefined) return;
      const h = Math.max(0, v/max*ih), x = PL+gw*i+2.5+bw*j, y = PT+ih-h;
      s += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" fill="'+se.color+'" rx="1.5"><title>'+esc(lb)+' '+esc(se.name)+': '+fmt(v)+'</title></rect>';
    });
    if(n<=32 || i%Math.ceil(n/24)===0)
      s += '<text x="'+(PL+gw*i+gw/2)+'" y="'+(H-11)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+esc(lb)+'</text>';
  });
  s += '</svg>';
  const lg = '<div class="lg">'+series.map(se=>'<span><span class="sw" style="background:'+se.color+'"></span>'+esc(se.name)+'</span>').join('')+'</div>';
  host.insertAdjacentHTML('beforeend','<div class="chart"><h3>'+esc(title)+'</h3>'+s+lg+'</div>');
}

function periodOptions(){
  const years = [...new Set(MONTHS.map(m=>m.slice(0,4)))].sort().reverse();
  let o = '<optgroup label="月">';
  MONTHS.slice().reverse().forEach(m=>o+='<option value="M:'+m+'"'+(m===LASTM?' selected':'')+'>'+mLabel(m)+(m===LASTM?'（当月）':'')+'</option>');
  o += '</optgroup><optgroup label="年">';
  years.forEach(y=>o+='<option value="Y:'+y+'">'+y.slice(2)+'年 通年</option>');
  o += '</optgroup><option value="A:">全期間</option>';
  return o;
}
const periodMonths = v => { const [k,x]=v.split(':');
  return k==='M'?[x] : k==='Y'?MONTHS.filter(m=>m.slice(0,4)===x) : MONTHS.slice(); };
const periodPrev = v => { const [k,x]=v.split(':');
  if(k==='M'){ const p=prevM(x); return mIdx.has(p)?[p]:null; }
  if(k==='Y'){ const ms=MONTHS.filter(m=>m.slice(0,4)===String(+x-1)); return ms.length?ms:null; }
  return null; };
const periodLabel = v => { const [k,x]=v.split(':');
  return k==='M'?mLabel(x):k==='Y'?x.slice(2)+'年通年':'全期間'; };

function periodWarn(v){
  const ms = periodMonths(v), pms = periodPrev(v);
  if(!pms) return '';
  const cur = ms.reduce((s,m)=>s+monTot[mIdx.get(m)].days,0);
  const pre = pms.reduce((s,m)=>s+monTot[mIdx.get(m)].days,0);
  if(cur >= pre) return '';
  return '<div class="warn">⚠ '+periodLabel(v)+'は<b>'+cur+'日分</b>のみのデータです。前年（'+pre+
    '日分）とのフル期間比較になるため、前年比は実態より低く表示されます。</div>';
}

views.prod = ()=>{
  let h = '<div class="bar"><label class="f">期間 <select id="p">'+periodOptions()+'</select></label>';
  h += '<label class="f">大分類 <select id="big"></select></label>';
  h += '<input type="text" id="q" placeholder="商品名・コードで絞り込み">';
  h += '<button class="btn" id="csv">CSV出力</button><span class="cnt" id="cnt"></span></div>';
  h += '<div class="hint">行をクリックすると「商品×日別」でその商品の日別推移を表示します。</div><div id="body"></div>';
  view.innerHTML = h;
  const sp=document.getElementById('p'), sb=document.getElementById('big'), q=document.getElementById('q');
  const bigs = [...new Set(PROD.map(p=>p[4]).filter(Boolean))].sort();
  sb.innerHTML = '<option value="">すべて</option>' + bigs.map(b=>'<option>'+esc(b)+'</option>').join('');
  sp.onchange=sb.onchange=draw; q.oninput=draw; draw();

  function draw(){
    const body=document.getElementById('body'); body.innerHTML=periodWarn(sp.value);
    const ms = periodMonths(sp.value), pms = periodPrev(sp.value);
    const agg = new Map(), pagg = new Map();
    ms.forEach(m=>pmByMonth[mIdx.get(m)].forEach((v,pi)=>{
      const a = agg.get(pi) || {qty:0,hon:0,amt:0,ara:0,pqty:0,pamt:0};
      a.qty+=v.sQty; a.hon+=v.sHon; a.amt+=v.sAmt; a.ara+=v.sAra; a.pqty+=v.pQty; a.pamt+=v.pAmt;
      agg.set(pi,a);
    }));
    if(pms) pms.forEach(m=>pmByMonth[mIdx.get(m)].forEach((v,pi)=>{
      const a = pagg.get(pi) || {qty:0,amt:0};
      a.qty+=v.sQty; a.amt+=v.sAmt; pagg.set(pi,a);
    }));
    const kw = q.value.trim().toLowerCase(), bf = sb.value;
    let rows = [...agg.entries()].map(([pi,a])=>{
      const p = PROD[pi], pv = pagg.get(pi);
      return { pi, code:p[0], name:p[1], spec:p[2], big:p[4], cat:p[5],
               qty:a.qty, hon:a.hon, amt:a.amt, ara:a.ara, pqty:a.pqty, pamt:a.pamt,
               pyQty: pms? (pv?pv.qty:0) : null, pyAmt: pms? (pv?pv.amt:0) : null,
               net: a.pqty - a.qty };
    }).filter(r=> (!bf || r.big===bf) &&
      (!kw || (r.name+' '+r.code+' '+r.cat+' '+r.spec).toLowerCase().includes(kw)));

    const cols = [
      {h:'商品コード', l:1, v:r=>r.code, f:r=>esc(r.code)},
      {h:'商品名', l:1, v:r=>r.name, f:r=>esc(r.name)},
      {h:'規格', l:1, v:r=>r.spec, f:r=>'<span class="mut">'+esc(r.spec||'')+'</span>'},
      {h:'分類', l:1, v:r=>r.cat, f:r=>'<span class="mut">'+esc(r.cat||'')+'</span>'},
      {h:'売上数量', v:r=>r.qty, f:r=>num(r.qty)},
      {h:'前年数量', v:r=>r.pyQty===null?0:r.pyQty, f:r=>r.pyQty===null?'<span class="mut">—</span>':num(r.pyQty)},
      {h:'数量前年比', v:r=>r.pyQty?((r.qty-r.pyQty)/Math.abs(r.pyQty)*100):-9999, f:r=>delta(r.qty,r.pyQty)},
      {h:'本数', v:r=>r.hon, f:r=>num(r.hon)},
      {h:'売上金額', v:r=>r.amt, f:r=>yen(r.amt)},
      {h:'前年金額', v:r=>r.pyAmt===null?0:r.pyAmt, f:r=>r.pyAmt===null?'<span class="mut">—</span>':yen(r.pyAmt)},
      {h:'金額前年比', v:r=>r.pyAmt?((r.amt-r.pyAmt)/Math.abs(r.pyAmt)*100):-9999, f:r=>delta(r.amt,r.pyAmt)},
      {h:'粗利', v:r=>r.ara, f:r=>yen(r.ara)},
      {h:'粗利率', v:r=>rate(r.ara,r.amt), f:r=>r.amt?rate(r.ara,r.amt).toFixed(1)+'%':'—'},
      {h:'仕入数量', v:r=>r.pqty, f:r=>num(r.pqty)},
      {h:'差引 (仕入-売上)', t:'期間内の 仕入数量 − 売上数量。在庫の増減目安', v:r=>r.net,
        f:r=>'<span class="'+(r.net<0?'neg':r.net>0?'pos':'mut')+'">'+(r.net>0?'+':'')+num(r.net)+'</span>'}
    ];
    document.getElementById('cnt').textContent = rows.length + '品目';
    const t = makeTable(body, cols, rows, { sortKey:8, sortDir:-1,
      key:r=>r.pi, onRow:pi=>{ PCAL_PROD = +pi; PCAL_PERIOD = sp.value; go('pcal'); },
      foot:(c,rs)=>{
        const map={'売上数量':'qty','前年数量':'pyQty','本数':'hon','売上金額':'amt','前年金額':'pyAmt','粗利':'ara','仕入数量':'pqty','差引 (仕入-売上)':'net'};
        if(c.h==='商品コード') return '合計 '+rs.length+'品目';
        if(c.h==='数量前年比'){ const a=rs.reduce((s,r)=>s+r.qty,0), b=rs.reduce((s,r)=>s+(r.pyQty||0),0); return b?delta(a,b):'—'; }
        if(c.h==='金額前年比'){ const a=rs.reduce((s,r)=>s+r.amt,0), b=rs.reduce((s,r)=>s+(r.pyAmt||0),0); return b?delta(a,b):'—'; }
        if(c.h==='粗利率'){ const a=rs.reduce((s,r)=>s+r.ara,0), b=rs.reduce((s,r)=>s+r.amt,0); return b?rate(a,b).toFixed(1)+'%':'—'; }
        const k=map[c.h]; if(!k) return '';
        const v=rs.reduce((s,r)=>s+(r[k]||0),0);
        return ['amt','pyAmt','ara'].includes(k) ? yen(v) : num(v);
      }});
    document.getElementById('csv').onclick = ()=>dlCsv('商品別_'+periodLabel(sp.value)+'.csv', t.csv());
  }
};

/* ===== 商品×日別 ===== */
let PCAL_PROD = null, PCAL_PERIOD = null;
views.pcal = ()=>{
  let h = '<div class="bar"><label class="f">商品 <select id="pr" style="max-width:340px"></select></label>';
  h += '<label class="f">期間 <select id="p">'+periodOptions()+'</select></label>';
  h += '<button class="btn" id="csv">CSV出力</button></div>';
  h += '<div class="hint">1商品の日別の出荷（売上）数量と仕入数量。日々の在庫の動きを確認できます。</div><div id="body"></div>';
  view.innerHTML = h;
  const pr=document.getElementById('pr'), sp=document.getElementById('p');
  const recent = MONTHS.slice(-12).map(m=>mIdx.get(m));
  const score = new Map();
  recent.forEach(mi=>pmByMonth[mi].forEach((v,pi)=>score.set(pi,(score.get(pi)||0)+v.sAmt)));
  const order = PROD.map((p,i)=>i).sort((a,b)=>(score.get(b)||0)-(score.get(a)||0));
  pr.innerHTML = order.map(i=>'<option value="'+i+'">'+esc(PROD[i][1])+'　['+esc(PROD[i][0])+']'+(PROD[i][2]?'　'+esc(PROD[i][2]):'')+'</option>').join('');
  if(PCAL_PROD!==null) pr.value = PCAL_PROD;
  if(PCAL_PERIOD) sp.value = PCAL_PERIOD;
  PCAL_PROD=null; PCAL_PERIOD=null;
  pr.onchange=sp.onchange=draw; draw();

  function draw(){
    const body=document.getElementById('body'); body.innerHTML='';
    const pi = +pr.value, ms = new Set(periodMonths(sp.value));
    const byDate = pdByProd[pi];
    const dis = DATES.map((d,i)=>({d,i})).filter(o=>ms.has(o.d.slice(0,7)));
    const rows = dis.map(o=>{
      const r = byDate.get(o.i);
      const pyi = dIdx.has(prevD(o.d)) ? dIdx.get(prevD(o.d)) : null;
      let pyQty = null;
      if(pyi!==null){ const p2 = byDate.get(pyi); pyQty = p2 ? p2.sQty : 0; }
      return { ds:o.d, w:wd(o.d), qty:r?r.sQty:0, hon:r?r.sHon:0, amt:r?r.sAmt:0, pqty:r?r.pQty:0, pyQty };
    });
    let run=0, runP=0; rows.forEach(r=>{ run+=r.qty; runP+=r.pqty; r.cum=run; r.cumP=runP; r.net=runP-run; });

    const p = PROD[pi];
    body.insertAdjacentHTML('beforeend','<div class="chart"><h3>'+esc(p[1])+'　['+esc(p[0])+']　'+esc(p[2]||'')+'　/　'+esc(p[4]||'')+' &gt; '+esc(p[5]||'')+'</h3></div>');
    barChart(body, '日別 売上数量　'+periodLabel(sp.value), rows.map(r=>dLabel(r.ds)),
      [ {name:'前年同日', color:C2, data:rows.map(r=>r.pyQty)},
        {name:'当年', color:C1, data:rows.map(r=>r.qty)} ], v=>num(v));

    const cols = [
      {h:'日付', l:1, v:r=>r.ds, f:r=>'<span class="'+(r.w===0?'sun':r.w===6?'sat':'')+'">'+dLabel(r.ds)+'（'+WD[r.w]+'）</span>'},
      {h:'売上数量', v:r=>r.qty, f:r=>r.qty?num(r.qty):'<span class="mut">0</span>'},
      {h:'前年同日', v:r=>r.pyQty===null?0:r.pyQty, f:r=>r.pyQty===null?'<span class="mut">—</span>':num(r.pyQty)},
      {h:'前年比', v:r=>r.pyQty?((r.qty-r.pyQty)/Math.abs(r.pyQty)*100):-9999, f:r=>delta(r.qty,r.pyQty)},
      {h:'本数', v:r=>r.hon, f:r=>num(r.hon)},
      {h:'売上金額', v:r=>r.amt, f:r=>yen(r.amt)},
      {h:'仕入数量', v:r=>r.pqty, f:r=>r.pqty?num(r.pqty):'<span class="mut">0</span>'},
      {h:'売上累計', v:r=>r.cum, f:r=>num(r.cum)},
      {h:'仕入累計', v:r=>r.cumP, f:r=>num(r.cumP)},
      {h:'差引累計', t:'仕入累計 − 売上累計（在庫増減の目安）', v:r=>r.net,
        f:r=>'<span class="'+(r.net<0?'neg':r.net>0?'pos':'mut')+'">'+(r.net>0?'+':'')+num(r.net)+'</span>'}
    ];
    const t = makeTable(body, cols, rows, { sortKey:0, sortDir:1, foot:(c,rs)=>{
      const map2={'売上数量':'qty','前年同日':'pyQty','本数':'hon','売上金額':'amt','仕入数量':'pqty'};
      if(c.h==='日付') return '合計 '+rs.length+'日';
      if(c.h==='前年比'){ const a=rs.reduce((s,r)=>s+r.qty,0), b=rs.reduce((s,r)=>s+(r.pyQty||0),0); return b?delta(a,b):'—'; }
      const k=map2[c.h]; if(!k) return '';
      const v=rs.reduce((s,r)=>s+(r[k]||0),0);
      return k==='amt'?yen(v):num(v);
    }});
    document.getElementById('csv').onclick = ()=>dlCsv('商品日別_'+p[1]+'_'+periodLabel(sp.value)+'.csv', t.csv());
  }
};

/* ===== 取引先別 ===== */
views.cust = ()=>{
  let h = '<div class="bar"><label class="f">期間 <select id="p">'+periodOptions()+'</select></label>';
  h += '<input type="text" id="q" placeholder="取引先名・担当者で絞り込み">';
  h += '<button class="btn" id="csv">CSV出力</button><span class="cnt" id="cnt"></span></div><div id="body"></div>';
  view.innerHTML = h;
  const sp=document.getElementById('p'), q=document.getElementById('q');
  sp.onchange=draw; q.oninput=draw; draw();

  function draw(){
    const body=document.getElementById('body'); body.innerHTML=periodWarn(sp.value);
    const ms=periodMonths(sp.value), pms=periodPrev(sp.value);
    const agg=new Map(), pagg=new Map();
    ms.forEach(m=>cmByMonth[mIdx.get(m)].forEach((v,ci)=>{
      const a=agg.get(ci)||{amt:0,ara:0,qty:0}; a.amt+=v.amt; a.ara+=v.ara; a.qty+=v.qty; agg.set(ci,a); }));
    if(pms) pms.forEach(m=>cmByMonth[mIdx.get(m)].forEach((v,ci)=>{
      const a=pagg.get(ci)||{amt:0}; a.amt+=v.amt; pagg.set(ci,a); }));
    const kw=q.value.trim().toLowerCase();
    const total = [...agg.values()].reduce((s,a)=>s+a.amt,0);
    let rows=[...agg.entries()].map(([ci,a])=>{
      const c=CUST[ci], pv=pagg.get(ci);
      return { code:c[0], name:c[1], tan:c[2], kbn:c[3], amt:a.amt, ara:a.ara, qty:a.qty,
               pyAmt: pms? (pv?pv.amt:0):null, share: total? a.amt/total*100:0 };
    }).filter(r=>!kw || (r.name+' '+r.code+' '+r.tan).toLowerCase().includes(kw));
    const cols=[
      {h:'取引先コード', l:1, v:r=>r.code, f:r=>esc(r.code)},
      {h:'取引先名', l:1, v:r=>r.name, f:r=>esc(r.name)+(r.kbn===1?' <span class="tag">社内</span>':'')},
      {h:'担当', l:1, v:r=>r.tan, f:r=>'<span class="mut">'+esc(r.tan||'')+'</span>'},
      {h:'売上金額', v:r=>r.amt, f:r=>yen(r.amt)},
      {h:'構成比', v:r=>r.share, f:r=>r.share.toFixed(1)+'%'},
      {h:'前年同期', v:r=>r.pyAmt===null?0:r.pyAmt, f:r=>r.pyAmt===null?'<span class="mut">—</span>':yen(r.pyAmt)},
      {h:'前年比', v:r=>r.pyAmt?((r.amt-r.pyAmt)/Math.abs(r.pyAmt)*100):-9999, f:r=>delta(r.amt,r.pyAmt)},
      {h:'粗利', v:r=>r.ara, f:r=>yen(r.ara)},
      {h:'粗利率', v:r=>rate(r.ara,r.amt), f:r=>r.amt?rate(r.ara,r.amt).toFixed(1)+'%':'—'},
      {h:'数量', v:r=>r.qty, f:r=>num(r.qty)}
    ];
    document.getElementById('cnt').textContent = rows.length+'件';
    const t=makeTable(body,cols,rows,{ sortKey:3, sortDir:-1, foot:(c,rs)=>{
      if(c.h==='取引先コード') return '合計 '+rs.length+'件';
      if(c.h==='前年比'){ const a=rs.reduce((s,r)=>s+r.amt,0), b=rs.reduce((s,r)=>s+(r.pyAmt||0),0); return b?delta(a,b):'—'; }
      if(c.h==='粗利率'){ const a=rs.reduce((s,r)=>s+r.ara,0), b=rs.reduce((s,r)=>s+r.amt,0); return b?rate(a,b).toFixed(1)+'%':'—'; }
      if(c.h==='構成比') return rs.reduce((s,r)=>s+r.share,0).toFixed(1)+'%';
      const map={'売上金額':'amt','前年同期':'pyAmt','粗利':'ara','数量':'qty'}, k=map[c.h];
      if(!k) return '';
      const v=rs.reduce((s,r)=>s+(r[k]||0),0);
      return k==='qty'?num(v):yen(v);
    }});
    document.getElementById('csv').onclick=()=>dlCsv('取引先別_'+periodLabel(sp.value)+'.csv', t.csv());
  }
};

/* ===== クロス集計 ===== */
const DIMS = {
  cust: { label:'取引先', of:(r,S)=>r[1], name:(k,S)=>S.party[k][1], sort:'measure' },
  tan:  { label:'担当',   of:(r,S)=>S.party[r[1]][2]||'(なし)', name:k=>k, sort:'measure' },
  prod: { label:'商品',   of:r=>r[2], name:k=>PROD[k][1]+'　['+PROD[k][0]+']', sort:'measure' },
  big:  { label:'大分類', of:r=>PROD[r[2]][4]||'(なし)', name:k=>k, sort:'measure' },
  cat:  { label:'分類',   of:r=>PROD[r[2]][5]||'(なし)', name:k=>k, sort:'measure' },
  mon:  { label:'月',     of:r=>dMon[r[0]], name:k=>mLabel(MONTHS[k]), sort:'key' },
  day:  { label:'日',     of:r=>r[0], name:k=>dLabel(DATES[k])+'（'+WD[wd(DATES[k])]+'）', sort:'key' }
};
const MEASURES = {
  amt:  { label:'売上金額', idx:5, fmt:yen, kinds:['s','p'], pLabel:'仕入金額' },
  qty:  { label:'数量',     idx:3, fmt:num, kinds:['s','p'] },
  hon:  { label:'本数',     idx:4, fmt:num, kinds:['s','p'] },
  ara:  { label:'粗利',     idx:6, fmt:yen, kinds:['s'] },
  rate: { label:'粗利率',   idx:-1, fmt:v=>v.toFixed(1)+'%', kinds:['s'] }
};
const MAXCOL = 40;

views.cross = ()=>{
  let h = '<div class="bar">';
  h += '<label class="f">種別 <select id="kind"><option value="s">売上</option><option value="p">仕入</option></select></label>';
  h += '<label class="f">期間 <select id="p">'+periodOptions()+'</select></label>';
  h += '<label class="f">行 <select id="rd"></select></label>';
  h += '<label class="f">列 <select id="cd"></select></label>';
  h += '<label class="f">指標 <select id="ms"></select></label>';
  h += '</div><div class="bar">';
  h += '<input type="text" id="qc" placeholder="取引先で絞り込み">';
  h += '<input type="text" id="qp" placeholder="商品・分類で絞り込み">';
  h += '<button class="btn" id="csv">CSV出力</button><span class="cnt" id="cnt"></span></div>';
  h += '<div class="hint">行と列を組み合わせて集計します。列が'+MAXCOL+'を超える場合は上位のみ表示し、残りは「その他」にまとめます。</div>';
  h += '<div id="body"></div>';
  view.innerHTML = h;

  const kind=document.getElementById('kind'), sp=document.getElementById('p'),
        rd=document.getElementById('rd'), cd=document.getElementById('cd'),
        ms=document.getElementById('ms'), qc=document.getElementById('qc'), qp=document.getElementById('qp');

  function fillDims(){
    const keys = Object.keys(DIMS);
    rd.innerHTML = keys.map(k=>'<option value="'+k+'"'+(k==='cust'?' selected':'')+'>'+DIMS[k].label+'</option>').join('');
    cd.innerHTML = '<option value="">（なし）</option>' +
      keys.map(k=>'<option value="'+k+'"'+(k==='mon'?' selected':'')+'>'+DIMS[k].label+'</option>').join('');
    const kk = kind.value;
    ms.innerHTML = Object.entries(MEASURES).filter(([,m])=>m.kinds.includes(kk))
      .map(([k,m])=>'<option value="'+k+'">'+(kk==='p'&&m.pLabel?m.pLabel:m.label)+'</option>').join('');
  }
  fillDims();
  kind.onchange = ()=>{ fillDims(); draw(); };
  sp.onchange=rd.onchange=cd.onchange=ms.onchange=draw;
  qc.oninput=qp.oninput=draw;
  draw();

  function draw(){
    const body=document.getElementById('body'); body.innerHTML='';
    const isSale = kind.value==='s';
    const S = { party: isSale ? CUST : SUPP };
    const src = isSale ? fRows : fpRows;
    const ms2 = new Set(periodMonths(sp.value).map(m=>mIdx.get(m)));
    const mk = ms.value || 'amt', meas = MEASURES[mk];
    const rdim = DIMS[rd.value], cdim = cd.value ? DIMS[cd.value] : null;
    const kwC = qc.value.trim().toLowerCase(), kwP = qp.value.trim().toLowerCase();

    // 絞り込み
    const rows = src.filter(r=>{
      if(!ms2.has(dMon[r[0]])) return false;
      if(kwC){ const p=S.party[r[1]]; if(!((p[1]+' '+p[0]+' '+(p[2]||'')).toLowerCase().includes(kwC))) return false; }
      if(kwP){ const p=PROD[r[2]]; if(!((p[1]+' '+p[0]+' '+(p[5]||'')+' '+(p[4]||'')).toLowerCase().includes(kwP))) return false; }
      return true;
    });

    // 集計（粗利率は 粗利/金額 なので分子分母を持つ）
    const cell = new Map();      // rowKey -> Map(colKey -> {v, amt, ara})
    const rowTot = new Map(), colTot = new Map();
    const add = (m,k,r)=>{ let e=m.get(k); if(!e){ e={v:0,amt:0,ara:0}; m.set(k,e); }
      e.v += mk==='rate' ? 0 : r[meas.idx]; e.amt += r[5]; if(isSale) e.ara += r[6]; };
    for(const r of rows){
      const rk = rdim.of(r,S), ck = cdim ? cdim.of(r,S) : '_';
      if(!cell.has(rk)) cell.set(rk, new Map());
      add(cell.get(rk), ck, r);
      add(rowTot, rk, r); add(colTot, ck, r);
    }
    const valOf = e => !e ? null : (mk==='rate' ? (e.amt? e.ara/e.amt*100 : null) : e.v);

    // 列の選定
    let colKeys = [...colTot.keys()];
    if(cdim){
      colKeys.sort(cdim.sort==='key' ? (a,b)=>a-b
        : (a,b)=>Math.abs(colTot.get(b).v||colTot.get(b).amt)-Math.abs(colTot.get(a).v||colTot.get(a).amt));
      if(colKeys.length > MAXCOL){
        const keep = new Set(colKeys.slice(0,MAXCOL));
        cell.forEach(cm=>{
          let o=null;
          [...cm.keys()].forEach(k=>{ if(!keep.has(k)){ const e=cm.get(k);
            if(!o){ o={v:0,amt:0,ara:0}; } o.v+=e.v; o.amt+=e.amt; o.ara+=e.ara; cm.delete(k); } });
          if(o) cm.set('__other__', o);
        });
        colKeys = colKeys.slice(0,MAXCOL).concat(['__other__']);
      }
      if(cdim.sort==='key') colKeys.sort((a,b)=> a==='__other__'?1 : b==='__other__'?-1 : a-b);
    } else colKeys = ['_'];

    // 表
    const data = [...cell.entries()].map(([rk,cm])=>({ rk, cm, tot: rowTot.get(rk) }));
    const cols = [{ h: rdim.label, l:1, v:o=>rdim.name(o.rk,S), f:o=>esc(rdim.name(o.rk,S)) }];
    if(cdim) colKeys.forEach(ck=>{
      const label = ck==='__other__' ? 'その他' : cdim.name(ck,S);
      cols.push({ h: esc(label), v:o=>{ const v=valOf(o.cm.get(ck)); return v===null?-Infinity:v; },
        f:o=>{ const v=valOf(o.cm.get(ck)); return v===null? '<span class="mut">-</span>' : meas.fmt(v); } });
    });
    cols.push({ h:'合計', v:o=>valOf(o.tot)===null?-Infinity:valOf(o.tot),
      f:o=>{ const v=valOf(o.tot); return v===null?'<span class="mut">-</span>':'<b>'+meas.fmt(v)+'</b>'; } });

    document.getElementById('cnt').textContent = data.length+'行 × '+colKeys.length+'列 / 明細'+num(rows.length)+'件';
    const t = makeTable(body, cols, data, {
      sortKey: cols.length-1, sortDir:-1,
      foot:(c,rs)=>{
        if(c.h===rdim.label) return '合計 '+rs.length+'行';
        const ck = c.h==='合計' ? null : colKeys[cols.indexOf(c)-1];
        const e = ck===null ? null : colTot.get(ck) || (ck==='__other__' ? null : null);
        if(c.h==='合計'){
          const amt=rs.reduce((s,o)=>s+o.tot.amt,0), ara=rs.reduce((s,o)=>s+o.tot.ara,0);
          const v = mk==='rate' ? (amt?ara/amt*100:0) : rs.reduce((s,o)=>s+o.tot.v,0);
          return '<b>'+meas.fmt(v)+'</b>';
        }
        const amt=rs.reduce((s,o)=>s+((o.cm.get(ck)||{}).amt||0),0);
        const ara=rs.reduce((s,o)=>s+((o.cm.get(ck)||{}).ara||0),0);
        const v = mk==='rate' ? (amt?ara/amt*100:0) : rs.reduce((s,o)=>s+((o.cm.get(ck)||{}).v||0),0);
        return meas.fmt(v);
      }
    });
    document.getElementById('csv').onclick = ()=>dlCsv(
      'クロス集計_'+rdim.label+'×'+(cdim?cdim.label:'なし')+'_'+periodLabel(sp.value)+'.csv', t.csv());
  }
};

/* ================= 解錠処理 =================
   データは AES-256-CBC で暗号化され、HMAC-SHA256 で改ざん検証している。
   鍵はパスワードから PBKDF2-SHA256 で導出する。パスワードを知らない場合、
   このファイルから取り出せる情報は暗号文のみ。                        */
(function(){
  const ENC = JSON.parse(document.getElementById('payload').textContent);
  const lock = document.getElementById('lock'), app = document.getElementById('app');
  const form = document.getElementById('lockForm'), pw = document.getElementById('pw');
  const msg = document.getElementById('msg'), btn = document.getElementById('go');
  const keep = document.getElementById('keep');
  const STORE = 'uriage-suii-key:' + ENC.salt;   // パスワード変更時は salt が変わり自動失効

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
  const eq = (a,b) => a.length===b.length && a.every((v,i)=>v===b[i]);

  if(!(window.crypto && crypto.subtle)){
    msg.innerHTML = '<span style="color:var(--neg)">この環境では復号できません。'+
      'HTTPS または localhost で開いてください。</span>';
    btn.disabled = true; return;
  }

  async function deriveBits(password, salt, iter){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
      'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits(
      { name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, 512));
  }

  async function unlockWith(bits){
    const aesKey = await crypto.subtle.importKey('raw', bits.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
    const macKey = await crypto.subtle.importKey('raw', bits.slice(32,64), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
    const iv = b64(ENC.iv), ct = b64(ENC.ct);
    const signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv); signed.set(ct, iv.length);
    const mac = new Uint8Array(await crypto.subtle.sign('HMAC', macKey, signed));
    if(!eq(mac, b64(ENC.mac))) throw new Error('bad-password');
    const plain = new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC', iv}, aesKey, ct));
    let text;
    if(ENC.gz){
      if(typeof DecompressionStream === 'undefined') throw new Error('no-gzip');
      const rs = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
      text = await new Response(rs).text();
    } else {
      text = new TextDecoder().decode(plain);
    }
    return JSON.parse(text);
  }

  async function attempt(password, bits, remember){
    const derived = bits || await deriveBits(password, b64(ENC.salt), ENC.iter);
    const D = await unlockWith(derived);
    if(remember){ try{ localStorage.setItem(STORE, toB64(derived)); }catch(e){} }
    lock.remove();
    app.hidden = false;
    bootApp(D);
  }

  // 保存済みの鍵があれば入力を省略する
  const saved = (()=>{ try{ return localStorage.getItem(STORE); }catch(e){ return null; } })();
  if(saved){
    attempt(null, b64(saved), false).catch(()=>{
      try{ localStorage.removeItem(STORE); }catch(e){}
    });
  }

  form.onsubmit = async e => {
    e.preventDefault();
    if(!pw.value){ return; }
    btn.disabled = true; msg.textContent = '確認中...'; msg.style.color = 'var(--muted)';
    try {
      await attempt(pw.value, null, keep.checked);
    } catch(err) {
      msg.style.color = 'var(--neg)';
      msg.textContent = err && err.message === 'no-gzip'
        ? 'このブラウザは非対応です。Edge か Chrome の最新版で開いてください。'
        : 'パスワードが違います。';
      btn.disabled = false; pw.select();
    }
  };
})();


</script>
